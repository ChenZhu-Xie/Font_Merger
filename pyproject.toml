[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "font-merger-union"
version = "2.3.4"
description = "Merge font families with automatic weights, Latin/CJK priority, selectable hinting and a GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ChenZhu-Xie" }]
dependencies = ["fonttools>=4.51"]

[project.scripts]
font-merger = "Font_Merger:main"
font-merger-gui = "Font_Merger_GUI:main"

[tool.setuptools]
py-modules = ["Font_Merger", "Font_Merger_GUI"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
lint = ["ruff==0.16.8"]

[tool.ruff]
required-version = "==0.16.8"

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set substantially. Keep the project's
# established lint contract explicit instead of inheriting version-dependent defaults.
select = ["E4", "E7", "E9", "F"]
