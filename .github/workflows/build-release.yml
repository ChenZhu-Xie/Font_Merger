name: Build standalone binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: font-merger-windows-x64
          - os: ubuntu-latest
            artifact: font-merger-linux-x64
          - os: macos-latest
            artifact: font-merger-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install ".[build]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name "${{ matrix.artifact }}" --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.encodings Font_Merger.py
      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        run: "& 'dist/${{ matrix.artifact }}.exe' --version"
      - name: Smoke test executable (Unix)
        if: runner.os != 'Windows'
        run: "./dist/${{ matrix.artifact }} --version"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
